name: Chainloop build attestation

# Attests the published Jenkins controller image (built from this repository's
# docker-bake.hcl version) together with its SBOM and vulnerability scan.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
      CHAINLOOP_ORG: demo
      CHAINLOOP_PROJECT: jenkins
      CHAINLOOP_WORKFLOW: build
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Jenkins version and image
        run: |
          version="$(sed -n '/^variable "JENKINS_VERSION"/,/^}/s/.*default *= *"\(.*\)".*/\1/p' docker-bake.hcl)"
          test -n "$version"
          echo "JENKINS_VERSION=${version}" >> "$GITHUB_ENV"
          echo "IMAGE=docker.io/jenkins/jenkins:${version}-jdk21" >> "$GITHUB_ENV"

      - name: Install Chainloop
        run: curl -sfL https://dl.chainloop.dev/cli/install.sh | bash -s

      - name: Initialize attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chainloop attestation init \
            --org "$CHAINLOOP_ORG" \
            --project "$CHAINLOOP_PROJECT" \
            --workflow "$CHAINLOOP_WORKFLOW" \
            --version "$JENKINS_VERSION"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v6
        with:
          sbom: sbom.cdx.json
          output-format: sarif
          output-file: grype.sarif
          fail-build: false

      - name: Add materials to the attestation
        run: |
          chainloop attestation add --name image --value "$IMAGE"
          chainloop attestation add --name sbom --value sbom.cdx.json
          chainloop attestation add --name vulnerability-scan --value grype.sarif

      - name: Push attestation
        run: chainloop attestation push

      - name: Mark attestation as failed
        if: ${{ failure() }}
        run: chainloop attestation reset || true

      - name: Mark attestation as cancelled
        if: ${{ cancelled() }}
        run: chainloop attestation reset --trigger cancellation || true
